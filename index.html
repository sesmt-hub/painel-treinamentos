<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Treinamentos Rede HG</title>
<style>
:root{
  --bg:#eaeef4; --card:#fff; --ink:#132330; --muted:#64748b; --line:#e3e8ef;
  --blue:#1a6ad4; --blue-dk:#12529f; --blue-soft:#dde9fa; --green:#17a34a;
  --amber:#d97706; --red:#dc2626;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.mono{font-family:var(--mono)}

/* cabeçalho */
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;
  padding:16px 20px;border-top:3px solid var(--blue);margin-bottom:14px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{width:46px;height:46px;object-fit:contain;flex:none}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.brand p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.scope{text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.8}
.scope b{color:var(--ink);font-weight:600}

/* filtros */
.filters{padding:14px 18px 16px;margin-bottom:14px}
.flab{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  font-weight:600;margin:0 0 8px}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{font:inherit;font-size:12.5px;padding:7px 14px;border-radius:7px;border:1px solid var(--line);
  background:#f7f9fc;color:#41526a;cursor:pointer;transition:.12s}
.pill:hover{border-color:#b9cbe4;color:var(--blue-dk)}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.selrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:14px;max-width:720px}
select{width:100%;font:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);
  border-radius:7px;background:#fff;color:var(--ink)}
select:focus,.pill:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}

/* abas */
.tabs{display:flex;gap:4px;padding:0 10px;margin-bottom:14px;overflow-x:auto}
.tab{font:inherit;font-size:13.5px;padding:12px 14px;border:0;background:transparent;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--blue);font-weight:600;border-bottom-color:var(--blue)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:14px}
.kpi{padding:14px 16px 16px}
.kpi .t{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:8px 0 4px}
.kpi .s{font-size:11.5px;color:var(--muted)}
.meter{height:6px;border-radius:4px;background:#e9eef5;margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .6s ease}

/* painéis de barras */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}
.panel{padding:16px 18px 10px}
.panel h2{margin:0;font-size:14.5px;font-weight:700}
.panel .sub{margin:3px 0 14px;font-size:11.5px;color:var(--muted)}
.scrolly{max-height:420px;overflow-y:auto;padding-right:6px;margin-right:-6px}
.row{margin-bottom:13px}
.row .l{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px}
.row .n{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .c{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none}
.bar{display:flex;align-items:center;gap:9px}
.track{flex:1;height:7px;border-radius:4px;background:#e9eef5;overflow:hidden}
.track i{display:block;height:100%;border-radius:4px;background:var(--blue);transition:width .6s ease}
.bar .p{font-family:var(--mono);font-size:11.5px;color:var(--muted);width:38px;text-align:right;flex:none}
.rank{display:inline-block;width:17px;color:var(--muted);font-family:var(--mono);font-size:11px}

/* matriz */
.scroller{overflow:auto;max-height:560px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{padding:7px 9px;text-align:left;white-space:nowrap}
thead th{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line);
  font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);vertical-align:bottom}
tbody th{position:sticky;left:0;z-index:2;background:#fff;font-weight:600;border-bottom:1px solid #f1f5f9}
tbody td{border-bottom:1px solid #f1f5f9;text-align:center;font-family:var(--mono);font-size:11.5px}
thead th:first-child{left:0;z-index:4}
.cellv{display:block;padding:4px 0;border-radius:5px}
tr.grp th,tr.grp td{background:#f7f9fc;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);font-weight:600}

/* pendentes */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:13px 18px;margin-bottom:12px}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;padding:8px 14px;border-radius:7px;border:1px solid var(--line);
  background:#fff;color:var(--ink);cursor:pointer;transition:.12s}
.btn:hover{border-color:#b9cbe4;color:var(--blue-dk)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--blue-dk);color:#fff}
.ptab td{white-space:normal;text-align:left;font-family:inherit}
.ptab td.num{text-align:center;font-family:var(--mono)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:5px;margin:2px 4px 2px 0;
  background:#fdecec;color:var(--red)}
.tag.sr{background:#fdf2e2;color:var(--amber)}
.empty{padding:50px 20px;text-align:center;color:var(--muted);font-size:13.5px}

/* atualizar base */
.up{padding:20px}
.drop{border:2px dashed #c6d4e6;border-radius:10px;padding:34px 20px;text-align:center;
  background:#f8fafd;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop b{display:block;font-size:15px;margin-bottom:4px}
.drop span{font-size:12.5px;color:var(--muted)}
.up ul{font-size:13px;color:#3d4d60;padding-left:20px;line-height:1.9}
.up code{background:#f1f5f9;padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:12px}
.note{font-size:12.5px;color:var(--muted);margin-top:16px;line-height:1.7}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);
  background:#132330;color:#fff;padding:11px 18px;border-radius:8px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.hide{display:none!important}
@media (max-width:620px){
  .scope{text-align:left}
  .kpi .v{font-size:27px}
  .head{padding:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ============================================================
   Helpers
   ============================================================ */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
let DATA = clone(BASE_ORIGINAL);

const fmt  = n => Number(n).toLocaleString('pt-BR');
const pctf = v => v === null ? '—' : (v*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%';
const pct0 = v => v === null ? '—' : Math.round(v*100) + '%';
const esc  = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const regLabel = r => r.replace('REGIONAL 1','Regional 1')
  .replace('REGIONAL 2 (TIAGO CARDOSO)','Regional 2 · Tiago Cardoso')
  .replace('REGIONAL 3 BRUNO VIANA','Regional 3 · Bruno Viana')
  .replace('REGIONAL 4 (FABIO ARAUJO','Regional 4 · Fabio Araujo')
  .replace('SEM REGIONAL (ADMINISTRATIVO/OUTROS)','Sem regional');
const MINUS = new Set(['DE','DO','DA','DOS','DAS','E']);
const filLabel = f => String(f).split(/\s+/).map((w,i)=>{
  if(/^[IVX]+$/.test(w)) return w;
  if(/^\d+$/.test(w)) return w;
  if(i && MINUS.has(w)) return w.toLowerCase();
  return w.charAt(0) + w.slice(1).toLowerCase();
}).join(' ');
const el = id => document.getElementById(id);

/* estado */
const S = { reg:null, fil:null, curso:null, page:'geral', sit:'todos' };

function scope(){
  return DATA.funcionarios.filter(([,fi]) => {
    if(S.reg !== null && DATA.filiais[fi][1] !== S.reg) return false;
    if(S.fil !== null && fi !== S.fil) return false;
    return true;
  });
}
/* matrículas = registros existentes; '-' não conta como matrícula */
function agg(rows, ci){
  let ins=0, apr=0, nap=0, sem=0;
  for(const [,,st] of rows){
    if(ci === null){
      for(const ch of st){ if(ch === '-') sem++; else { ins++; ch === 'A' ? apr++ : nap++; } }
    } else {
      const ch = st[ci];
      if(ch === '-') sem++; else { ins++; ch === 'A' ? apr++ : nap++; }
    }
  }
  return {ins, apr, nap, sem, idx: ins ? apr/ins : null, pessoas: rows.length};
}
const CI = () => S.curso === null ? null : DATA.cursos.indexOf(S.curso);
function emDia(rows, ci){
  return rows.filter(([,,st]) => ci === null ? ![...st].some(c => c === 'N') : st[ci] !== 'N').length;
}

/* ============================================================
   Filtros
   ============================================================ */
function drawFilters(){
  const pills = ['<button class="pill' + (S.reg === null ? ' on' : '') + '" data-r="all" type="button">Rede inteira</button>']
    .concat(DATA.regionais.map((r,i) =>
      `<button class="pill${S.reg===i?' on':''}" data-r="${i}" type="button">${esc(regLabel(r).toUpperCase())}</button>`));
  el('regPills').innerHTML = pills.join('');

  const fils = DATA.filiais.map((f,i) => ({i, nome: filLabel(f[0]), ri: f[1]}))
    .filter(f => S.reg === null || f.ri === S.reg)
    .sort((a,b) => a.nome.localeCompare(b.nome,'pt-BR'));
  el('selFil').innerHTML = '<option value="">Todas as filiais</option>' +
    fils.map(f => `<option value="${f.i}"${S.fil===f.i?' selected':''}>${esc(f.nome)}</option>`).join('');

  el('selCurso').innerHTML = '<option value="">Todos os cursos</option>' +
    DATA.cursos.map((c,i) => `<option value="${esc(c)}"${S.curso===c?' selected':''}>${esc(DATA.cursosCurto[i])}</option>`).join('');
}

/* ============================================================
   Páginas
   ============================================================ */
function pageGeral(){
  const rows = scope(), ci = CI(), a = agg(rows, ci);
  const fil100 = emDia(rows, ci);
  const nFil = new Set(rows.map(([,fi]) => fi)).size;

  const kpis = `
  <div class="kpis">
    <div class="card kpi">
      <div class="t">Andamento do escopo</div>
      <div class="v">${pctf(a.idx)}</div>
      <div class="s">${fmt(a.apr)} de ${fmt(a.ins)} matrículas concluídas</div>
      <div class="meter"><i style="width:${(a.idx||0)*100}%"></i></div>
    </div>
    <div class="card kpi">
      <div class="t">Colaboradores</div>
      <div class="v">${fmt(rows.length)}</div>
      <div class="s">${fmt(nFil)} ${nFil===1?'filial':'filiais'} no escopo</div>
    </div>
    <div class="card kpi">
      <div class="t">Treinamentos pendentes</div>
      <div class="v">${fmt(a.nap)}</div>
      <div class="s">${ci===null?'somando todos os cursos exigidos':'em '+esc(DATA.cursosCurto[ci])}</div>
    </div>
    <div class="card kpi">
      <div class="t">Colaboradores 100% em dia</div>
      <div class="v">${fmt(fil100)}</div>
      <div class="s">${rows.length ? pctf(fil100/rows.length) : '—'} do efetivo do escopo</div>
      <div class="meter"><i style="width:${rows.length ? fil100/rows.length*100 : 0}%"></i></div>
    </div>
  </div>`;

  /* por filial */
  const porFil = {};
  rows.forEach(r => (porFil[r[1]] = porFil[r[1]] || []).push(r));
  const listaFil = Object.keys(porFil).map(fi => {
    const g = agg(porFil[fi], ci);
    return {nome: filLabel(DATA.filiais[fi][0]), ...g};
  }).sort((x,y) => (x.idx ?? 2) - (y.idx ?? 2) || x.nome.localeCompare(y.nome,'pt-BR'));

  const porCur = DATA.cursos.map((c,i) => ({nome: DATA.cursosCurto[i], ...agg(rows, i)}));

  const barra = (o, i) => `
    <div class="row">
      <div class="l"><div class="n">${i!==undefined?`<span class="rank">${i+1}.</span>`:''}${esc(o.nome)}</div>
        <div class="c">${fmt(o.apr)}/${fmt(o.ins)}</div></div>
      <div class="bar"><div class="track"><i style="width:${(o.idx||0)*100}%"></i></div>
        <div class="p">${pct0(o.idx)}</div></div>
    </div>`;

  return kpis + `
  <div class="cols">
    <section class="card panel">
      <h2>Conclusão por filial</h2>
      <p class="sub">Percentual de matrículas concluídas em cada filial, da menor para a maior</p>
      <div class="scrolly">${listaFil.length ? listaFil.map(o => barra(o)).join('') : '<p class="empty">Sem dados no escopo.</p>'}</div>
    </section>
    <section class="card panel">
      <h2>Conclusão por curso</h2>
      <p class="sub">Na sequência oficial dos treinamentos</p>
      <div class="scrolly">${porCur.map((o,i) => barra(o,i)).join('')}</div>
    </section>
  </div>`;
}

function heat(v){
  if(v === null) return 'background:#f4f6f9;color:#94a3b8';
  const a = 0.10 + v*0.80;
  return `background:rgba(26,106,212,${a.toFixed(2)});color:${v > 0.55 ? '#fff' : '#1e293b'}`;
}
function pageMatriz(){
  const rows = scope();
  if(!rows.length) return '<section class="card"><p class="empty">Sem dados no escopo.</p></section>';
  const porFil = {};
  rows.forEach(r => (porFil[r[1]] = porFil[r[1]] || []).push(r));
  const fis = Object.keys(porFil).map(Number)
    .map(fi => ({fi, tot: agg(porFil[fi], null), nome: filLabel(DATA.filiais[fi][0])}))
    .sort((a,b) => (b.tot.idx ?? -1) - (a.tot.idx ?? -1) || a.nome.localeCompare(b.nome,'pt-BR'));

  let body = '';
  fis.forEach((o, n) => {
    const g = DATA.cursos.map((c,i) => agg(porFil[o.fi], i));
    body += `<tr><th><span class="rank">${n+1}.</span>${esc(o.nome)}</th>` +
      g.map(x => `<td><span class="cellv" style="${heat(x.idx)}">${pct0(x.idx)}</span></td>`).join('') +
      `<td><span class="cellv" style="${heat(o.tot.idx)};font-weight:700">${pct0(o.tot.idx)}</span></td></tr>`;
  });
  return `<section class="card panel">
    <h2>Matriz curso × filial</h2>
    <p class="sub">Percentual de matrículas concluídas, do posto com melhor geral para o pior. Quanto mais escuro, melhor.</p>
    <div class="scroller"><table>
      <thead><tr><th>Filial</th>${DATA.cursosCurto.map(c => `<th>${esc(c)}</th>`).join('')}<th>Geral</th></tr></thead>
      <tbody>${body}</tbody></table></div>
  </section>`;
}

/* colaboradores com pendência, com os cursos de cada um */
function pendData(){
  const ci = CI(), out = [];
  for(const [n, fi, st] of scope()){
    const cursos = [];
    for(let i = 0; i < st.length; i++){
      if(ci !== null && i !== ci) continue;
      const ch = st[i];
      if(ch === 'A') continue;
      const tipo = ch === '-' ? 'sr' : 'na';
      if(S.sit !== 'todos' && tipo !== S.sit) continue;
      cursos.push({i, tipo});
    }
    if(!cursos.length) continue;
    out.push({n, fi, f: DATA.filiais[fi][0], r: DATA.filiais[fi][1], cursos});
  }
  return out.sort((a,b) => a.r - b.r ||
    filLabel(a.f).localeCompare(filLabel(b.f),'pt-BR') || a.n.localeCompare(b.n,'pt-BR'));
}
function pagePend(){
  const pend = pendData(), ci = CI();
  const total = pend.reduce((s,p) => s + p.cursos.length, 0);
  const porFil = {};
  pend.forEach(p => porFil[p.f] = (porFil[p.f] || 0) + 1);

  let tb = '', lastF = '';
  for(const p of pend){
    if(p.f !== lastF){
      tb += `<tr class="grp"><td colspan="3">${esc(regLabel(DATA.regionais[p.r]))} › ${esc(filLabel(p.f))}</td>
        <td class="num">${porFil[p.f]}</td></tr>`;
      lastF = p.f;
    }
    tb += `<tr><td>${esc(p.n)}</td><td>${esc(filLabel(p.f))}</td><td class="num">${p.cursos.length}</td>
      <td>${p.cursos.map(c => `<span class="tag">${esc(DATA.cursosCurto[c.i])}</span>`).join('')}</td></tr>`;
  }

  return `
  <div class="card toolbar">
    <div class="seg"></div>
    <button class="btn primary" id="btnDl" type="button">Baixar lista filtrada</button>
  </div>
  <section class="card panel">
    <h2>Quem ainda não fez${ci!==null ? ' — ' + esc(DATA.cursosCurto[ci]) : ''}</h2>
    <p class="sub">${fmt(pend.length)} colaboradores · ${fmt(total)} pendências · use o filtro de filial acima para ver uma empresa só</p>
    ${pend.length ? `<div class="scroller"><table class="ptab">
      <thead><tr><th>Colaborador</th><th>Filial</th><th>Pend.</th><th>Cursos pendentes</th></tr></thead>
      <tbody>${tb}</tbody></table></div>`
    : '<p class="empty">Ninguém pendente com os filtros atuais.</p>'}
  </section>`;
}

function pageBase(){
  return `
  <section class="card up">
    <h2 style="margin:0 0 4px;font-size:15px">Atualizar a base</h2>
    <p class="sub" style="margin:0 0 16px;font-size:12.5px;color:var(--muted)">
      Envie a planilha em <code>.xlsx</code> ou <code>.csv</code>. O cálculo é feito no seu navegador — nada é enviado para fora.</p>
    <div class="drop" id="drop"><b>Arraste a planilha aqui</b><span>ou toque para escolher o arquivo</span></div>
    <input type="file" id="file" accept=".xlsx,.csv,.txt" class="hide">
    <p class="flab" style="margin:18px 0 6px">Colunas necessárias</p>
    <ul>
      <li><code>Participante</code> — nome do colaborador</li>
      <li><code>Aprovação</code> — "Aprovado" ou "Não aprovado"</li>
      <li><code>Empresa</code> — filial, como "Rede HG Posto Ferrari"</li>
      <li><code>Curso</code> — nome do curso</li>
    </ul>
    <p class="note">A ordem das colunas não importa. Se o arquivo trouxer uma aba <b>Base de Regionais</b>,
      o vínculo filial → regional é atualizado junto.</p>
    <p class="note"><b>Ajustes fixos:</b> Posto Gurupi e Maracanã 2 entram na Regional 4 · Eucaliptos entra na Regional 3 · Papa Leguas I = Papa Leguas 1 ·
      Planalto = Planalto II · PQ Coqueiros = PQ dos Coqueiros · Colonial = Colonial 101 ·
      as duas grafias de "Aperfeiçoe Frentista" contam como um curso só · o prefixo "Rede HG Posto" é ignorado.</p>
    <p style="margin-top:18px"><button class="btn" id="btnReset" type="button">Restaurar base original</button></p>
  </section>`;
}

/* ============================================================
   Render
   ============================================================ */
function render(){
  drawFilters();
  const rows = scope(), a = agg(rows, CI());
  const nFil = new Set(rows.map(([,fi]) => fi)).size;
  el('scopeName').textContent = S.fil !== null ? filLabel(DATA.filiais[S.fil][0])
    : S.reg !== null ? regLabel(DATA.regionais[S.reg]) : 'Rede inteira';
  el('scopeNums').textContent = `${fmt(nFil)} filiais · ${fmt(rows.length)} colaboradores · ${fmt(a.ins)} matrículas`;
  [...el('tabs').children].forEach(b => b.classList.toggle('on', b.dataset.p === S.page));
  el('main').innerHTML = S.page === 'geral' ? pageGeral()
    : S.page === 'matriz' ? pageMatriz()
    : S.page === 'pend' ? pagePend() : pageBase();
  if(S.page === 'base') wireBase();
  if(S.page === 'pend') el('btnDl').onclick = downloadList;
  el('srcname').textContent = `${FONTE} · ${fmt(DATA.meta.linhas)} registros`;
}

let toastT;
function toast(msg){
  const t = el('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=> t.classList.remove('on'), 4200);
}

/* eventos */
el('regPills').onclick = e => {
  const b = e.target.closest('[data-r]'); if(!b) return;
  S.reg = b.dataset.r === 'all' ? null : +b.dataset.r;
  S.fil = null; render();
};
el('selFil').onchange = e => { S.fil = e.target.value === '' ? null : +e.target.value; render(); };
el('selCurso').onchange = e => { S.curso = e.target.value || null; render(); };
el('tabs').onclick = e => { const b = e.target.closest('[data-p]'); if(b){ S.page = b.dataset.p; render(); } };

/* exportação */
function pendTabela(){
  const cab = ['Regional','Empresa','Colaborador','Pendências','Cursos pendentes'];
  const linhas = pendData().map(p => [
    regLabel(DATA.regionais[p.r]), filLabel(p.f), p.n, p.cursos.length,
    p.cursos.map(c => DATA.cursosCurto[c.i]).join(' | ')
  ]);
  return {cab, linhas};
}
function downloadList(){
  const {cab, linhas} = pendTabela();
  if(!linhas.length) return toast('Não há pendências no filtro atual.');
  const q = v => '"' + String(v).replace(/"/g,'""') + '"';
  const csv = '\ufeff' + [cab, ...linhas].map(l => l.map(q).join(';')).join('\r\n');
  const partes = ['pendentes'];
  if(S.fil !== null) partes.push(filLabel(DATA.filiais[S.fil][0]));
  else if(S.reg !== null) partes.push(regLabel(DATA.regionais[S.reg]));
  if(CI() !== null) partes.push(DATA.cursosCurto[CI()]);
  const nome = partes.join('-').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w-]+/g,'_') + '.csv';
  const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 2000);
  toast(`${linhas.length} colaboradores baixados em CSV.`);
}

/* aba Atualizar base */
function wireBase(){
  const fileEl = el('file'), drop = el('drop');
  drop.onclick = ()=> fileEl.click();
  fileEl.onchange = ()=> { if(fileEl.files[0]) handleFile(fileEl.files[0]); fileEl.value = ''; };
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if(f) handleFile(f); });
  el('btnReset').onclick = ()=>{
    DATA = clone(BASE_ORIGINAL);
    S.reg = S.fil = S.curso = null; FONTE = FONTE_ORIG;
    render(); toast('Base original restaurada.');
  };
}

const FONTE_ORIG = 'Base 09/2026';
let FONTE = FONTE_ORIG;

/* --- ZIP mínimo: lê as entradas de um .xlsx --- */
async function unzip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eo = -1;
  for(let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eo = i; break; }
  }
  if(eo < 0) throw new Error('Arquivo .xlsx inválido (não parece um pacote zip).');
  let n = dv.getUint16(eo + 10, true), off = dv.getUint32(eo + 16, true);
  const out = {};
  for(let k = 0; k < n; k++){
    if(dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const csize  = dv.getUint32(off + 20, true);
    const fnLen  = dv.getUint16(off + 28, true);
    const exLen  = dv.getUint16(off + 30, true);
    const cmLen  = dv.getUint16(off + 32, true);
    const lho    = dv.getUint32(off + 42, true);
    const name   = new TextDecoder().decode(u8.subarray(off + 46, off + 46 + fnLen));
    if(csize === 0xffffffff || lho === 0xffffffff) throw new Error('Planilha em formato ZIP64 — salve novamente pelo Excel como .xlsx comum.');
    const lfn = dv.getUint16(lho + 26, true), lex = dv.getUint16(lho + 28, true);
    const start = lho + 30 + lfn + lex;
    const data = u8.subarray(start, start + csize);
    out[name] = { method, data };
    off += 46 + fnLen + exLen + cmLen;
  }
  return out;
}
async function inflate(entry){
  if(entry.method === 0) return new TextDecoder().decode(entry.data);
  if(typeof DecompressionStream === 'undefined')
    throw new Error('Este navegador não consegue abrir .xlsx aqui. Salve a planilha como .csv e envie novamente.');
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([entry.data]).stream().pipeThrough(ds);
  return await new Response(stream).text();
}
const COL = ref => { let n = 0; for(const ch of ref){ const c = ch.charCodeAt(0); if(c < 65 || c > 90) break; n = n*26 + (c-64); } return n-1; };

async function readXlsx(buf){
  const z = await unzip(buf);
  const P = new DOMParser();
  const wbXml = await inflate(z['xl/workbook.xml'] || (()=>{throw new Error('Planilha sem xl/workbook.xml.')})());
  const relsXml = await inflate(z['xl/_rels/workbook.xml.rels']);
  const wb = P.parseFromString(wbXml, 'application/xml');
  const rels = P.parseFromString(relsXml, 'application/xml');
  const relMap = {};
  rels.querySelectorAll('Relationship').forEach(r => relMap[r.getAttribute('Id')] = r.getAttribute('Target').replace(/^\/?xl\//,''));

  let shared = [];
  if(z['xl/sharedStrings.xml']){
    const ss = P.parseFromString(await inflate(z['xl/sharedStrings.xml']), 'application/xml');
    shared = [...ss.getElementsByTagName('si')].map(si =>
      [...si.getElementsByTagName('t')].filter(t => t.parentNode.nodeName !== 'rPh').map(t => t.textContent).join(''));
  }

  const sheets = [];
  for(const sh of wb.getElementsByTagName('sheet')){
    const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    const path = 'xl/' + (relMap[rid] || '').replace(/^\//,'');
    if(!z[path]) continue;
    const doc = P.parseFromString(await inflate(z[path]), 'application/xml');
    const rows = [];
    for(const row of doc.getElementsByTagName('row')){
      const arr = [];
      for(const c of row.getElementsByTagName('c')){
        const idx = COL(c.getAttribute('r') || '');
        const t = c.getAttribute('t');
        let v = '';
        if(t === 'inlineStr'){ v = [...c.getElementsByTagName('t')].map(x=>x.textContent).join(''); }
        else {
          const vn = c.getElementsByTagName('v')[0];
          if(vn) v = (t === 's') ? (shared[+vn.textContent] ?? '') : vn.textContent;
        }
        arr[idx >= 0 ? idx : arr.length] = v;
      }
      rows.push(arr);
    }
    sheets.push({ nome: sh.getAttribute('name') || '', rows });
  }
  if(!sheets.length) throw new Error('Não encontrei nenhuma aba com dados na planilha.');
  return sheets;
}
function readCsv(txt){
  txt = txt.replace(/^﻿/, '');
  const sep = (txt.split('\n')[0].match(/;/g)||[]).length > (txt.split('\n')[0].match(/,/g)||[]).length ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for(let i = 0; i < txt.length; i++){
    const ch = txt[i];
    if(q){ if(ch === '"'){ if(txt[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if(ch === '"') q = true;
    else if(ch === sep){ row.push(cell); cell = ''; }
    else if(ch === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if(ch !== '\r') cell += ch;
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return [{ nome: 'CSV', rows }];
}

/* --- normalização e montagem do modelo --- */
const norm = s => String(s ?? '').toUpperCase().trim()
  .normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const normFil = s => norm(s).replace(/^REDE HG POSTO /,'').replace(/^REDE HG /,'').replace(/^POSTO /,'').trim();
const ALIAS = { 'PAPA LEGUAS I':'PAPA LEGUAS 1', 'PLANALTO':'PLANALTO II', 'PQ COQUEIROS':'PQ DOS COQUEIROS', 'COLONIAL':'COLONIAL 101' };
const SEM_REG = 'SEM REGIONAL (ADMINISTRATIVO/OUTROS)';
/* vinculos definidos manualmente - aplicados mesmo quando a planilha enviada nao os traz */
const OVERRIDES = [ { fil:'GURUPI', nome:'GURUPI', reg:/^REGIONAL 4/ },
                    { fil:'MARACANA 2', nome:'MARACANA 2', reg:/^REGIONAL 4/ },
                    { fil:'EUCALIPTOS', nome:'EUCALIPTOS', reg:/^REGIONAL 3/ } ];
/* grafias diferentes do mesmo curso na exportacao da plataforma */
const CURSO_ALIAS = { 'APERFEICOE FRENTISTA CAIXA':'APERFEIÇOE FRENTISTA',
                      'APERFEICOE FRENTISTACAIXA':'APERFEIÇOE FRENTISTA' };

function findCols(header){
  const H = header.map(norm);
  const at = (...alts) => { for(const a of alts){ const i = H.findIndex(h => h === a || h.startsWith(a)); if(i >= 0) return i; } return -1; };
  return {
    p: at('PARTICIPANTE','FUNCIONARIO','NOME','COLABORADOR'),
    a: at('APROVACAO','SITUACAO APROVACAO','STATUS','RESULTADO'),
    e: at('EMPRESA','FILIAL','UNIDADE','POSTO'),
    c: at('CURSO','TREINAMENTO')
  };
}
function build(sheets){
  /* mapa filial → regional: da aba de regionais, se vier; senão mantém o atual */
  let map = null, regNames = null;
  const shReg = sheets.find(s => /REGIONA/.test(norm(s.nome)));
  if(shReg && shReg.rows.length > 1){
    const cols = (shReg.rows[0] || []).map(x => String(x ?? '').trim()).filter(Boolean);
    if(cols.length){
      map = {}; regNames = cols.slice();
      for(let r = 1; r < shReg.rows.length; r++){
        cols.forEach((cn, ci)=>{
          const v = (shReg.rows[r] || [])[ci];
          if(v && String(v).trim()) map[normFil(v)] = { reg: cn, nome: String(v).trim() };
        });
      }
    }
  }
  if(!map){
    map = {}; regNames = DATA.regionais.filter(r => r !== SEM_REG);
    DATA.filiais.forEach(([f, ri]) => { if(DATA.regionais[ri] !== SEM_REG) map[normFil(f)] = { reg: DATA.regionais[ri], nome: f }; });
  }
  /* aplica os vinculos manuais por cima do mapa da planilha */
  for(const ov of OVERRIDES){
    const alvo = regNames.find(r => ov.reg.test(norm(r)));
    if(alvo) map[ov.fil] = { reg: alvo, nome: ov.nome };
  }

  /* aba de dados: a que tiver as 4 colunas */
  let dados = null, C = null;
  for(const s of sheets){
    if(s === shReg || !s.rows.length) continue;
    for(let h = 0; h < Math.min(5, s.rows.length); h++){
      const c = findCols(s.rows[h] || []);
      if(c.p >= 0 && c.a >= 0 && c.e >= 0 && c.c >= 0){ dados = { rows: s.rows.slice(h+1), nome: s.nome }; C = c; break; }
    }
    if(dados) break;
  }
  if(!dados) throw new Error('Não achei as colunas Participante, Aprovação, Empresa e Curso na planilha.');

  const regs = [...regNames, SEM_REG];
  const filInfo = new Map();   /* filialNome -> regIdx */
  const cursos = [];
  const pessoas = new Map();   /* nome -> {fil, st:Map(curso->A/N)} */
  let linhas = 0, aprov = 0;

  for(const r of dados.rows){
    const nome = String(r[C.p] ?? '').trim();
    let curso = String(r[C.c] ?? '').trim();
    curso = CURSO_ALIAS[norm(curso)] || curso;
    const emp = String(r[C.e] ?? '').trim();
    if(!nome || !curso || !emp) continue;
    linhas++;
    let k = normFil(emp); k = ALIAS[k] || k;
    const hit = map[k];
    const fil = hit ? hit.nome : k;
    const ri = hit ? regs.indexOf(hit.reg) : regs.length - 1;
    if(!filInfo.has(fil)) filInfo.set(fil, ri < 0 ? regs.length - 1 : ri);
    if(!cursos.includes(curso)) cursos.push(curso);
    const ok = norm(r[C.a]) === 'APROVADO';
    if(ok) aprov++;
    if(!pessoas.has(nome)) pessoas.set(nome, { fil, st:{} });
    pessoas.get(nome).st[curso] = ok ? 'A' : 'N';
  }
  if(!linhas) throw new Error('A planilha foi lida, mas não tinha nenhuma linha de dados válida.');

  /* ordem dos cursos: mantém a ordem atual para os que já existem, novos vão para o fim */
  const ordem = DATA.cursos.filter(c => cursos.includes(c)).concat(cursos.filter(c => !DATA.cursos.includes(c)));
  const curto = ordem.map(c => { const i = DATA.cursos.indexOf(c); return i >= 0 ? DATA.cursosCurto[i] : c; });

  const filiais = [...filInfo.entries()]
    .sort((a,b) => a[1] - b[1] || a[0].localeCompare(b[0],'pt-BR'))
    .map(([f, ri]) => [f, ri]);
  const fidx = new Map(filiais.map((f,i) => [f[0], i]));

  const funcionarios = [...pessoas.entries()]
    .sort((a,b) => a[0].localeCompare(b[0],'pt-BR'))
    .map(([n, v]) => [n, fidx.get(v.fil), ordem.map(c => v.st[c] || '-').join('')]);

  return { cursos: ordem, cursosCurto: curto, regionais: regs, filiais, funcionarios,
           meta:{ linhas, aprov, pessoas: funcionarios.length } };
}

async function handleFile(file){
  try{
    toast('Lendo ' + file.name + '…');
    const sheets = /\.csv$|\.txt$/i.test(file.name)
      ? readCsv(await file.text())
      : await readXlsx(await file.arrayBuffer());
    const novo = build(sheets);
    DATA = novo;
    S.reg = S.fil = null;
    if(S.curso && !DATA.cursos.includes(S.curso)) S.curso = null;
    FONTE = file.name;
    S.page = 'geral';
    render();
    toast(`Base atualizada: ${fmt(novo.meta.linhas)} registros, ${fmt(novo.filiais.length)} filiais, ${novo.cursos.length} cursos.`);
  } catch(err){
    console.error(err);
    toast('Não consegui ler o arquivo. ' + (err.message || ''));
  }
}

render();
</script>
